trigger:
  batch: true
  branches:
    include:
      - legacy

resources:
  repositories:
    - repository: niveristand-custom-device-build-tools
      type:       github
      ref:        main
      endpoint:   nivs-custom-devices
      name:       ni/niveristand-custom-device-build-tools

stages:
  - template: azure-templates/stages-legacy.yml@niveristand-custom-device-build-tools
    parameters:

      lvVersionsToBuild:
        - version: '2025'
          bitness: '32bit'
        - version: '2025'
          bitness: '64bit'
        - version: '2026'
          bitness: '32bit'
        - version: '2026'
          bitness: '64bit'

      buildSteps:
        - projectLocation: 'Source\Modules.lvproj'
          buildOperation: 'ExecuteBuildSpec'
          target: 'My Computer'
          buildSpec: 'Modules'
          exclusions:
            - version: '2025'
              bitness: '32bit'
            - version: '2026'
              bitness: '32bit'

        - projectLocation: 'Source\Modules.lvproj'
          buildOperation: 'ExecuteBuildSpec'
          target: 'Linux x64'
          buildSpec: 'Modules'
          exclusions:
            - version: '2025'
              bitness: '64bit'
            - version: '2026'
              bitness: '64bit'

        - projectLocation: 'Source\Modules.lvproj'
          buildOperation: 'ExecuteBuildSpec'
          target: 'My Computer'
          buildSpec: 'NI ECAT Remote IO'
          exclusions:
            - version: '2025'
              bitness: '32bit'
            - version: '2026'
              bitness: '32bit'

        - projectLocation: 'Source\Modules.lvproj'
          buildOperation: 'ExecuteBuildSpec'
          target: 'Linux x64'
          buildSpec: 'NI ECAT Remote IO'
          exclusions:
            - version: '2025'
              bitness: '64bit'
            - version: '2026'
              bitness: '64bit'

      releaseVersion: '27.0.0'
      buildOutputLocation: 'Built'
      archiveLocation: '\\nirvana\Measurements\VeriStandAddons\legacy\scan_engine_modules'
      repoName: 'niveristand-scan-engine-module-libraries'
      createNetCoreRepo: false
